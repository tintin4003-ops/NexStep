<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - NexStep</title>
    <link rel="stylesheet" href="css/style.css">
   
</head>

<body>

   
    <div class="navbar">
        <div class="container">
            <a class="logo" href="index.html"><span class="logo-box">N</span>NexStep</a>
            <a class="link" href="index.html">Home</a>
            <a class="link" href="login.html">Login</a>
            <a class="link" href="register.html">Register</a>
        </div>
    </div>

    <div class="main">
        <div class="container">

            <div class="card form-box">
                <h1>Reset Password</h1>
                <p class="gray">Enter your email. We will send you a link to set a new password.</p>
                <form action="login.html" method="get">

                    <label for="email">Email:</label><br>
                    <input type="email" id="email" name="email" required><br><br>

                    <input class="btn btn-full" type="submit" value="Send reset link">
                </form>
            </div>

        </div>
    </div>

    <div class="footer">
        NexStep - Connecting Students with Skills, Mentors and Opportunities Globally 
    </div>

</body>

</html>
