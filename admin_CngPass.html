<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password - NexStep</title>
    <link rel="stylesheet" href="css/style.css">
    
</head>

<body>


     <div class="navbar">
        <div class="container">
            <a class="logo" href="admin_Dashboard.html"><span class="logo-box">N</span>NexStep</a>
            <a class="link" href="admin_Dashboard.html">Dashboard</a>
            <a class="link" href="admin_Users.html">Manage Users</a>
            <a class="link" href="admin_Posts.html">Manage Posts</a>
            <a class="link" href="admin_Warnings.html">Issue Warnings</a>
            <a class="link current" href="admin_Profile.html">Profile</a>
            <a class="link" href="index.html">Logout</a>
        </div>
    </div>

   
    <div class="main">
        <div class="container">

            <div class="card form-box">
                <h1>Change Password</h1>
                <form action="#" method="get">

                    <label for="old">Current password:</label><br>
                    <input type="password" id="old" name="old" required><br><br>

                    <label for="new">New password:</label><br>
                    <input type="password" id="new" name="new" minlength="6" required><br><br>

                    <label for="new2">Confirm new password:</label><br>
                    <input type="password" id="new2" name="new2" required><br><br>

                    <input class="btn" type="submit" value="Save password">
                    <a class="btn btn-outline" href="profile.html">Cancel</a>
                </form>
            </div>

        </div>
    </div>

    <div class="footer">
        NexStep - Connecting Students with Skills, Mentors and Opportunities Globally 
    </div>

</body>

</html>
