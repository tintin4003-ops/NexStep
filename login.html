<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - NexStep</title>
    <link rel="stylesheet" href="css/style.css">

</head>

<body>

   
    <div class="navbar">
        <div class="container">
            <a class="logo" href="index.html"><span class="logo-box">N</span>NexStep</a>
            <a class="link" href="index.html">Home</a>
            <a class="link current" href="login.html">Login</a>
            <a class="link" href="register.html">Register</a>
        </div>
    </div>

   
    <div class="main">
        <div class="container">

            <div class="card form-box">
                <h1>Login</h1>
                <form action="#" method="get">

                    <label for="email">Email:</label>
                    <br>
                    <input type="email" id="email" name="email" required>
                    <br><br>

                    <label for="password">Password:</label>
                    <br>
                    <input type="password" id="password" name="password" required>
                    <br><br>

                    <input class="btn btn-full" type="submit" value="Login">
                </form>
                <p class="small"><br><a href="forget_Pass.html">Forgot password?</a> | <a href="register.html">Create an account</a></p>
            </div>

        </div>
    </div>

    <div class="footer">
        NexStep - Connecting Students with Skills, Mentors and Opportunities Globally 
    </div>

</body>

</html>
