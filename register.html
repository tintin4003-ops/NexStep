<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - NexStep</title>
    <link rel="stylesheet" href="css/style.css">
    
</head>

<body>


    <div class="navbar">
        <div class="container">
            <a class="logo" href="index.html"><span class="logo-box">N</span>NexStep</a>
            <a class="link" href="index.html">Home</a>
            <a class="link" href="login.html">Login</a>
            <a class="link current" href="register.html">Register</a>
        </div>
    </div>

 
    <div class="main">
        <div class="container">

            <div class="card form-box">
                <h1>User Registration</h1>
                <form action="login.html" method="get">

                    <label>I am a:</label><br>
                    <input type="radio" id="student" name="usertype" value="student" checked>
                    <label for="student" class="line">Student</label>
                    <input type="radio" id="org" name="usertype" value="org">
                    <label for="org" class="line">NGO / Organization</label>
                    <input type="radio" id="mentor" name="usertype" value="mentor">
                    <label for="mentor" class="line">Alumni / Mentor</label><br><br>

                    <label for="name">Full name / Organization name:</label><br>
                    <input type="text" id="name" name="name" required><br><br>

                    <label for="email">Email:</label><br>
                    <input type="email" id="email" name="email" required><br><br>

                    <label for="password">Password:</label><br>
                    <input type="password" id="password" name="password" minlength="6" required><br>
                    <span class="subtext">At least 6 characters.</span><br><br>

                    <label for="password2">Confirm password:</label><br>
                    <input type="password" id="password2" name="password2" required><br><br>

                    <input class="btn btn-full" type="submit" value="Register">
                </form>
            </div>

        </div>
    </div>

    <div class="footer">
        NexStep - Connecting Students with Skills, Mentors and Opportunities Globally 
    </div>

</body>

</html>
